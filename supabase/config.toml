# Supabase project config.
# Docs: https://supabase.com/docs/guides/local-development/cli/config

project_id = "appfinanzas"

[api]
enabled = true
port = 54321
schemas = ["public", "graphql_public"]

[db]
port = 54322

[studio]
enabled = true
port = 54323

[auth]
enabled = true
site_url = "http://localhost:3000"
additional_redirect_urls = ["http://localhost:3000/auth/callback"]

[auth.external.google]
enabled = false
# client_id = ""
# secret = ""

[auth.external.apple]
enabled = false
# client_id = ""
# secret = ""

[storage]
enabled = true

[edge_runtime]
enabled = true

[functions.telegram-webhook]
verify_jwt = false

[functions.receipt-ocr]
verify_jwt = true

[functions.exchange-rates-cron]
verify_jwt = false

[functions.pair-telegram]
verify_jwt = true
